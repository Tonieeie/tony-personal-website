<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>404 — Anomaly Detected · Tony Teng</title>
<meta name="robots" content="noindex">
<meta name="description" content="404 — you glitched into Earth-404, a dimension where this page doesn't exist. Type 'home' to get back.">
<style>
  :root {
    --bg: #05040b;
    --ink: #f5f3ff;
    --magenta: #ff2bd6;
    --cyan: #00f0ff;
    --yellow: #ffe14d;
    --red: #ff4d6d;
    --violet: #9b6bff;
    --grey: #9b97b5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(ellipse at 50% 45%, #1d0838 0%, #0a0616 45%, var(--bg) 80%);
    background-color: var(--bg);
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
    font-size: 14px;
    line-height: 1.55;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 16px 16px 16px max(16px, 7vw);
  }
  /* The rift you fell through, still churning beside the terminal. */
  canvas#rift {
    position: fixed; left: 74%; top: 50%;
    width: min(86vmin, 780px); height: min(86vmin, 780px);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 0;
  }
  .halftone {
    position: fixed; inset: 0;
    pointer-events: none;
    background: radial-gradient(circle, rgba(255, 43, 214, 0.18) 0 1.2px, transparent 1.8px) 0 0 / 12px 12px;
    -webkit-mask-image: radial-gradient(ellipse at center, transparent 30%, #000 85%);
    mask-image: radial-gradient(ellipse at center, transparent 30%, #000 85%);
    z-index: 1;
  }
  .terminal {
    position: relative;
    z-index: 2;
    width: min(680px, 100%);
    max-height: calc(100vh - 32px);
    background: rgba(9, 7, 18, 0.93);
    border: 2px solid var(--ink);
    border-radius: 4px;
    box-shadow: -4px 0 0 var(--cyan), 4px 0 0 var(--magenta), 12px 12px 0 #000;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: tear 5.2s steps(1) infinite;
  }
  /* Every few seconds the window slips out of register and tears in slices. */
  @keyframes tear {
    0%, 93%, 100% { transform: none; clip-path: none; box-shadow: -4px 0 0 var(--cyan), 4px 0 0 var(--magenta), 12px 12px 0 #000; }
    94% { transform: translateX(-6px) skewX(-3deg); clip-path: inset(0 0 52% 0); box-shadow: -10px 0 0 var(--cyan), 10px 0 0 var(--magenta), 12px 12px 0 #000; }
    95.5% { transform: translateX(5px); clip-path: inset(30% 0 8% 0); }
    97% { transform: translateX(-2px); clip-path: none; box-shadow: -7px 0 0 var(--yellow), 7px 0 0 var(--cyan), 12px 12px 0 #000; }
  }
  .chrome {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    background: var(--yellow);
    border-bottom: 2px solid #000;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #000; }
  .dot.r { background: var(--magenta); }
  .dot.y { background: #fff; }
  .dot.g { background: var(--cyan); }
  .title {
    margin-left: 10px;
    color: #111;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    user-select: none;
  }
  .body {
    padding: 18px 20px 16px;
    overflow-y: auto;
    flex: 1;
    scrollbar-width: thin;
    scrollbar-color: var(--magenta) transparent;
  }
  .body::-webkit-scrollbar { width: 8px; }
  .body::-webkit-scrollbar-thumb { background: rgba(255, 43, 214, 0.45); border-radius: 4px; }
  .line { white-space: pre-wrap; word-break: break-word; }
  .prompt { color: var(--cyan); }
  .user { color: var(--red); }
  .path { color: var(--yellow); }
  .err { color: var(--red); }
  .dim { color: var(--grey); }
  .accent { color: var(--magenta); }
  .ok { color: var(--cyan); }
  .ascii {
    position: relative;
    display: inline-block;
    color: var(--ink);
    font-size: 11px;
    line-height: 1.05;
    margin: 8px 0 12px;
  }
  .ascii.glitch::before,
  .ascii.glitch::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .ascii.glitch::before { color: var(--magenta); animation: sliceA 0.9s steps(2, end) infinite; }
  .ascii.glitch::after { color: var(--cyan); animation: sliceB 0.9s steps(2, end) infinite; }
  @keyframes sliceA {
    0%   { transform: translate(-2px, 0);  clip-path: inset(0 0 62% 0); }
    25%  { transform: translate(-4px, 1px); clip-path: inset(18% 0 50% 0); }
    50%  { transform: translate(-1px, 0);  clip-path: inset(40% 0 30% 0); }
    75%  { transform: translate(-3px, -1px); clip-path: inset(8% 0 70% 0); }
    100% { transform: translate(-2px, 0);  clip-path: inset(0 0 62% 0); }
  }
  @keyframes sliceB {
    0%   { transform: translate(2px, 0);  clip-path: inset(62% 0 0 0); }
    25%  { transform: translate(4px, -1px); clip-path: inset(50% 0 16% 0); }
    50%  { transform: translate(1px, 0);  clip-path: inset(70% 0 4% 0); }
    75%  { transform: translate(3px, 1px); clip-path: inset(30% 0 46% 0); }
    100% { transform: translate(2px, 0);  clip-path: inset(62% 0 0 0); }
  }
  .input-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .input-row .promptline { color: var(--cyan); white-space: nowrap; }
  .input-row .promptline .user { color: var(--red); }
  .input-row .promptline .path { color: var(--yellow); }
  #cmd {
    flex: 1;
    background: transparent;
    border: 0;
    outline: 0;
    color: var(--ink);
    font: inherit;
    caret-color: transparent;
  }
  .caret {
    display: inline-block;
    width: 8px; height: 1em;
    background: var(--magenta);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  a.linkish {
    color: var(--cyan);
    text-decoration: none;
    border-bottom: 1px dashed rgba(0, 240, 255, 0.45);
  }
  a.linkish:hover { color: var(--yellow); border-color: var(--yellow); }
  kbd {
    background: rgba(255, 225, 77, 0.1);
    border: 1px solid rgba(255, 225, 77, 0.4);
    border-radius: 3px;
    padding: 1px 6px;
    color: var(--yellow);
    font-family: inherit;
    font-size: 11px;
  }
  @media (max-width: 900px) {
    body { justify-content: center; padding-left: 16px; }
    canvas#rift { left: 50%; width: 110vmin; height: 110vmin; }
  }
  @media (max-width: 560px) {
    body { font-size: 13px; padding: 8px; }
    .body { padding: 14px 14px 12px; }
    .ascii { font-size: 8px; }
    .title { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .terminal, .ascii.glitch::before, .ascii.glitch::after, .caret { animation: none; }
  }
</style>
</head>
<body>
<canvas id="rift"></canvas>
<div class="halftone"></div>

<div class="terminal" id="terminal">
  <div class="chrome">
    <div class="dot r"></div>
    <div class="dot y"></div>
    <div class="dot g"></div>
    <div class="title">spider-society://anomaly-404 — glitch</div>
  </div>
  <div class="body" id="body">
    <div id="output"></div>
    <div class="input-row" id="inputrow" style="display:none">
      <span class="promptline"><span class="user">tony@portfolio</span>:<span class="path">~</span>$</span>
      <input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
      <span class="caret" id="caret"></span>
    </div>
  </div>
</div>

<script src="/assets/spiderverse/rift.js"></script>
<script>
(function () {
  var output    = document.getElementById('output');
  var inputRow  = document.getElementById('inputrow');
  var cmdInput  = document.getElementById('cmd');
  var bodyEl    = document.getElementById('body');

  var requestedPath = (location.pathname + location.search) || '/';
  if (requestedPath.length > 80) requestedPath = requestedPath.slice(0, 77) + '...';

  var ASCII_404 = [
    "  _  _    ___  _  _   ",
    " | || |  / _ \\| || |  ",
    " | || |_| | | | || |_ ",
    " |__   _| |_| |__   _|",
    "    |_|  \\___/   |_|  "
  ].join("\n");

  function el(tag, cls, text) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (text != null) d.textContent = text;
    return d;
  }

  function scrollBottom() {
    bodyEl.scrollTop = bodyEl.scrollHeight;
  }

  // Append a finished line
  function writeLine(html) {
    var d = document.createElement('div');
    d.className = 'line';
    d.innerHTML = html;
    output.appendChild(d);
    scrollBottom();
    return d;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  // Type a string into a target element, char-by-char
  function typeInto(target, text, speed, done) {
    var i = 0;
    (function step() {
      if (i >= text.length) { if (done) done(); return; }
      target.textContent += text.charAt(i++);
      scrollBottom();
      setTimeout(step, speed);
    })();
  }

  // Type a "command" line (cyan prompt + typed text) and resolve when done
  function typeCommand(text, speed) {
    return new Promise(function (resolve) {
      var line = document.createElement('div');
      line.className = 'line';
      line.innerHTML =
        '<span class="promptline"><span class="user">tony@portfolio</span>:<span class="path">~</span>$</span> ';
      var typed = el('span', 'user');
      line.appendChild(typed);
      var caret = el('span', 'caret');
      line.appendChild(caret);
      output.appendChild(line);
      scrollBottom();
      typeInto(typed, text, speed || 75, function () {
        caret.remove();
        resolve();
      });
    });
  }

  function pause(ms) {
    return new Promise(function (r) { setTimeout(r, ms); });
  }

  var PAGES = [
    { name: 'about',      desc: 'who I am' },
    { name: 'experience', desc: 'work history' },
    { name: 'skills',     desc: 'tech stack' },
    { name: 'projects',   desc: 'things I have built' },
    { name: 'web',        desc: 'sites I have shipped' },
    { name: 'contact',    desc: 'how to reach me' }
  ];

  var COMMANDS = {
    help: function () {
      writeLine('<span class="dim">available commands:</span>');
      writeLine('  <span class="ok">ls</span>          — list sections of the site');
      writeLine('  <span class="ok">cd ~</span>        — return to homepage');
      writeLine('  <span class="ok">cd &lt;name&gt;</span>  — jump to a section (e.g. <span class="accent">cd projects</span>)');
      writeLine('  <span class="ok">home</span>        — same as <span class="accent">cd ~</span>');
      writeLine('  <span class="ok">whoami</span>      — about the host');
      writeLine('  <span class="ok">contact</span>     — open email');
      writeLine('  <span class="ok">github</span>      — open GitHub');
      writeLine('  <span class="ok">sudo</span>        — try it');
      writeLine('  <span class="ok">clear</span>       — wipe the screen');
      writeLine('  <span class="ok">exit</span>        — leave (also goes home)');
    },
    ls: function () {
      var rows = PAGES.map(function (p) {
        return '  <a class="linkish" href="/#' + p.name + '">' +
               p.name.padEnd(12, ' ') + '</a><span class="dim">' + p.desc + '</span>';
      }).join('<br>');
      writeLine(rows);
    },
    cd: function (arg) {
      if (!arg || arg === '~' || arg === '/' || arg === '..' || arg === 'home') {
        writeLine('<span class="dim">jumping back to earth-1610...</span>');
        setTimeout(function () { location.href = '/'; }, 350);
        return;
      }
      var hit = PAGES.find(function (p) { return p.name === arg.toLowerCase(); });
      if (hit) {
        writeLine('<span class="dim">jumping to #' + hit.name + '</span>');
        setTimeout(function () { location.href = '/#' + hit.name; }, 350);
      } else {
        writeLine('<span class="err">bash: cd: ' + escapeHtml(arg) + ': No such file or directory</span>');
        writeLine('<span class="dim">try </span><span class="accent">ls</span><span class="dim"> to see what is here.</span>');
      }
    },
    home: function () { COMMANDS.cd('~'); },
    exit: function () { COMMANDS.cd('~'); },
    whoami: function () {
      writeLine('<span class="ok">bingsen (tony) teng</span>');
      writeLine('<span class="dim">developer · cybersecurity · ai systems</span>');
      writeLine('<span class="dim">mcs @ university of melbourne</span>');
    },
    contact: function () {
      writeLine('<span class="dim">opening mail client...</span>');
      setTimeout(function () { location.href = 'mailto:bingsen.teng777@gmail.com'; }, 250);
    },
    github: function () {
      writeLine('<span class="dim">opening github.com/Tonieeie...</span>');
      setTimeout(function () { window.open('https://github.com/Tonieeie', '_blank', 'noopener'); }, 250);
    },
    sudo: function () {
      writeLine('<span class="err">[sudo] password for visitor:</span> <span class="dim">****************</span>');
      writeLine('<span class="err">visitor is not in the sudoers file. This incident will be reported to the Spider-Society.</span>');
    },
    clear: function () {
      output.innerHTML = '';
    },
    '': function () { /* empty enter, do nothing */ }
  };

  function runCommand(raw) {
    var trimmed = raw.trim();
    // echo the entered command
    writeLine(
      '<span class="promptline"><span class="user">tony@portfolio</span>:<span class="path">~</span>$</span> ' +
      escapeHtml(trimmed)
    );
    if (trimmed === '') return;
    var parts = trimmed.split(/\s+/);
    var name = parts[0].toLowerCase();
    var arg  = parts.slice(1).join(' ');
    var fn = COMMANDS[name];
    if (fn) {
      fn(arg);
    } else {
      writeLine('<span class="err">bash: ' + escapeHtml(name) + ': command not found</span>');
      writeLine('<span class="dim">type </span><span class="accent">help</span><span class="dim"> for a list of commands.</span>');
    }
  }

  // ── Boot sequence ──────────────────────────────────────────────────────────
  function boot() {
    writeLine('<span class="err">⚠ anomaly detected</span> <span class="dim">— you glitched into Earth-404</span>');
    return typeCommand('cd ' + requestedPath, 75)
      .then(function () { return pause(220); })
      .then(function () {
        writeLine('<span class="err">bash: cd: ' + escapeHtml(requestedPath) + ': No such file or directory</span>');
        return pause(420);
      })
      .then(function () { return typeCommand('status --code', 70); })
      .then(function () { return pause(180); })
      .then(function () {
        var d = el('pre', 'ascii glitch');
        d.textContent = ASCII_404;
        d.setAttribute('data-text', ASCII_404);
        output.appendChild(d);
        writeLine('<span class="dim">this page does not exist in any known universe.</span>');
        return pause(380);
      })
      .then(function () { return typeCommand('help', 90); })
      .then(function () { return pause(120); })
      .then(function () {
        COMMANDS.help();
        writeLine('');
        writeLine('<span class="dim">tip: type </span><span class="accent">cd ~</span><span class="dim"> or hit </span><kbd>Enter</kbd><span class="dim"> on an empty line to go home.</span>');
        inputRow.style.display = 'flex';
        cmdInput.focus();
      });
  }

  // ── Input handling ─────────────────────────────────────────────────────────
  var history = [];
  var hIndex  = -1;

  cmdInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var v = cmdInput.value;
      if (v.trim().length) { history.push(v); }
      hIndex = history.length;
      cmdInput.value = '';
      runCommand(v);
      scrollBottom();
    } else if (e.key === 'ArrowUp') {
      if (history.length && hIndex > 0) {
        hIndex--;
        cmdInput.value = history[hIndex];
        e.preventDefault();
      }
    } else if (e.key === 'ArrowDown') {
      if (hIndex < history.length - 1) {
        hIndex++;
        cmdInput.value = history[hIndex];
      } else {
        hIndex = history.length;
        cmdInput.value = '';
      }
      e.preventDefault();
    } else if (e.key === 'Tab') {
      e.preventDefault();
      var prefix = cmdInput.value.toLowerCase();
      var pool = Object.keys(COMMANDS).concat(PAGES.map(function (p) { return p.name; }));
      var match = pool.filter(function (k) { return k && k.indexOf(prefix) === 0; });
      if (match.length === 1) cmdInput.value = match[0];
    }
  });

  // Click anywhere in the terminal body refocuses input
  bodyEl.addEventListener('click', function () { cmdInput.focus(); });

  // ── Rift background (assets/spiderverse/rift.js) ───────────────────────────
  if (window.GlitchRift) {
    window.GlitchRift.mount(document.getElementById('rift'), { intensity: 1.4, coreScale: 0.3, maxDpr: 1, specks: 10 });
  }

  // Kick off
  boot();
})();
</script>
</body>
</html>
